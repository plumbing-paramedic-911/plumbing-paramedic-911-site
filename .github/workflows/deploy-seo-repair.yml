name: Deploy Plumbing Paramedic 911 to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-namecheap-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate SEO/AEO and upload production site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Build and validate SEO/AEO release
        run: |
          set -euo pipefail
          python3 tools/release_build.py
          python3 tools/check_internal_links.py

      - name: Verify and normalize deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }

          FTP_HOST_CLEAN="$(printf '%s' "$FTP_SERVER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_USER_CLEAN="$(printf '%s' "$FTP_USERNAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          test -n "$FTP_HOST_CLEAN" || { echo "FTP_SERVER contains only whitespace"; exit 1; }
          test -n "$FTP_USER_CLEAN" || { echo "FTP_USERNAME contains only whitespace"; exit 1; }

          echo "FTP_HOST_CLEAN=$FTP_HOST_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_USER_CLEAN=$FTP_USER_CLEAN" >> "$GITHUB_ENV"

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Upload validated production site over FTPS
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER_CLEAN','$FTP_PASS' 'ftp://$FTP_HOST_CLEAN';
            pwd;
            put -O . .htaccess;
            mirror -R --verbose --parallel=2 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob tools/ \
              --exclude-glob '*.md' \
              --exclude-glob '__pycache__/' \
              ./ .;
            bye
          "

      - name: Confirm production deployment scope
        run: |
          echo "Validated and uploaded the full public website tree."
          echo "Source/build files (.git, .github, tools, Markdown) were excluded."
          echo "No remote delete/mirror-delete option was used."
