name: Deploy Plumbing Paramedic 911 to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-namecheap-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate SEO/AEO, deploy, and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Build and validate SEO/AEO release
        run: |
          set -euo pipefail
          python3 tools/release_build.py
          python3 tools/check_internal_links.py

      - name: Verify and normalize deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }

          FTP_HOST_CLEAN="$(printf '%s' "$FTP_SERVER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_USER_CLEAN="$(printf '%s' "$FTP_USERNAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          test -n "$FTP_HOST_CLEAN" || { echo "FTP_SERVER contains only whitespace"; exit 1; }
          test -n "$FTP_USER_CLEAN" || { echo "FTP_USERNAME contains only whitespace"; exit 1; }

          echo "FTP_HOST_CLEAN=$FTP_HOST_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_USER_CLEAN=$FTP_USER_CLEAN" >> "$GITHUB_ENV"

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Upload validated production site over FTPS
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Namecheap FTPS upload attempt ${attempt}/3"
            if lftp -c "
              set cmd:fail-exit yes;
              set ftp:ssl-allow yes;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data yes;
              set ssl:verify-certificate yes;
              set ftp:passive-mode yes;
              set net:timeout 45;
              set net:max-retries 5;
              open -u '$FTP_USER_CLEAN','$FTP_PASS' 'ftp://$FTP_HOST_CLEAN';
              pwd;
              put -O . .htaccess;
              mirror -R --verbose --parallel=2 \
                --exclude-glob .git/ \
                --exclude-glob .github/ \
                --exclude-glob tools/ \
                --exclude-glob '*.md' \
                --exclude-glob '__pycache__/' \
                --exclude-glob '_noop.txt' \
                --exclude-glob '_branch_marker.tmp' \
                ./ .;
              rm -f _noop.txt;
              rm -f _branch_marker.tmp;
              bye
            "; then
              echo "Namecheap FTPS upload completed on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Namecheap FTPS upload failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify live production
        env:
          BASE_URL: https://plumbingparamedic911.com
        run: |
          set -euo pipefail

          fetch() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$1"
          }

          assert_title() {
            path="$1"
            expected="$2"
            body="$(fetch "${BASE_URL}${path}?deploy=${GITHUB_SHA}")"
            printf '%s' "$body" | grep -Fq "<title>${expected}</title>" || {
              echo "Live title mismatch on ${path}. Expected: ${expected}"
              exit 1
            }
            echo "Verified title: ${path}"
          }

          assert_redirect() {
            path="$1"
            expected="$2"
            result="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}${path}")"
            [ "$result" = "301 ${expected}" ] || {
              echo "Redirect mismatch for ${path}: ${result}"
              exit 1
            }
            echo "Verified redirect: ${path} -> ${expected}"
          }

          assert_title '/services/well-pump-repair/' \
            'Well Pump Repair Abbeville SC | Plumbing Paramedic 911'
          assert_title '/services/plumbing-fixture-installation-repair/' \
            'Fixture Repair Abbeville SC | Plumbing Paramedic 911'
          assert_title '/services/backflow-prevention-testing/' \
            'Backflow Testing Upstate SC | Plumbing Paramedic 911'
          assert_title '/service-areas/mccormick-sc/' \
            'McCormick SC Plumber & Well Pumps | Plumbing Paramedic 911'
          assert_title '/service-areas/calhoun-falls-sc/' \
            'Calhoun Falls SC Plumber | Plumbing Paramedic 911'

          areas="$(fetch "${BASE_URL}/service-areas/?deploy=${GITHUB_SHA}")"
          printf '%s' "$areas" | grep -Fq '/service-areas/iva-lake-secession-sc/'
          printf '%s' "$areas" | grep -Fq '/service-areas/savannah-lakes-village-sc/'
          echo 'Verified static lake/rural service-area links.'

          well="$(fetch "${BASE_URL}/services/well-pump-repair/?deploy=${GITHUB_SHA}")"
          printf '%s' "$well" | grep -Fq 'id="lake-area-well-pump-focus"'
          echo 'Verified well-pump market authority block.'

          llms="$(fetch "${BASE_URL}/llms.txt?deploy=${GITHUB_SHA}")"
          printf '%s' "$llms" | grep -Fq 'Service / diagnostic call: **$79**'
          printf '%s' "$llms" | grep -Fq 'Iva & Lake Secession, SC'
          echo 'Verified current AI-readable business and pricing facts.'

          guides="$(fetch "${BASE_URL}/guides/?deploy=${GITHUB_SHA}")"
          printf '%s' "$guides" | grep -Fq 'Homeowner Plumbing Guides by Eric Callaway'
          printf '%s' "$guides" | grep -Fq 'Get the Complete Bundle'
          echo 'Verified paid homeowner guide storefront remains live.'

          headers="$(curl --silent --show-error --head \
            -H 'Cache-Control: no-cache' "${BASE_URL}/?deploy=${GITHUB_SHA}" | tr -d '\r')"
          printf '%s' "$headers" | grep -i 'content-security-policy:' | \
            grep -Fq 'https://wuwgvtjktppjueiykcww.supabase.co'
          echo 'Verified Supabase lead-capture CSP allowance.'

          assert_redirect '/blog/signs-water-heater-failing/' \
            'https://plumbingparamedic911.com/services/water-heater-repair-replacement/'
          assert_redirect '/costs/' \
            'https://plumbingparamedic911.com/pricing/'
          assert_redirect '/costs/emergency-plumber-cost/' \
            'https://plumbingparamedic911.com/pricing/'
          assert_redirect '/service-areas/iva-sc/' \
            'https://plumbingparamedic911.com/service-areas/iva-lake-secession-sc/'

          not_found_url="${BASE_URL}/seo-verification-page-that-does-not-exist-${GITHUB_SHA}/"
          status="$(curl --silent --show-error --output /tmp/pp911-404.html \
            --write-out '%{http_code}' "$not_found_url")"
          [ "$status" = '404' ] || { echo "Expected live 404 status, got ${status}"; exit 1; }
          grep -Fq 'Looks like this page needs a rescue.' /tmp/pp911-404.html
          echo 'Verified branded 404 response.'

          for junk in '/_noop.txt' '/_branch_marker.tmp'; do
            junk_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}${junk}")"
            [ "$junk_status" = '404' ] || { echo "Unexpected temporary file remains live: ${junk} (${junk_status})"; exit 1; }
          done
          echo 'Verified temporary deployment files are absent.'

          echo 'Live production verification passed.'

      - name: Confirm production deployment scope
        run: |
          echo "Validated, uploaded, and live-verified the full public website tree."
          echo "Source/build files (.git, .github, tools, Markdown) were excluded."
          echo "No remote mirror-delete was used; obsolete indexed URLs are handled by explicit redirects."
