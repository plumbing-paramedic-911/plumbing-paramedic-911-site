name: Deploy SEO Repair to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-namecheap-seo-repair
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload repaired files to Namecheap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Verify and normalize deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }

          FTP_HOST_CLEAN="$(printf '%s' "$FTP_SERVER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_USER_CLEAN="$(printf '%s' "$FTP_USERNAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          test -n "$FTP_HOST_CLEAN" || { echo "FTP_SERVER contains only whitespace"; exit 1; }
          test -n "$FTP_USER_CLEAN" || { echo "FTP_USERNAME contains only whitespace"; exit 1; }

          echo "FTP_HOST_CLEAN=$FTP_HOST_CLEAN" >> "$GITHUB_ENV"
          echo "FTP_USER_CLEAN=$FTP_USER_CLEAN" >> "$GITHUB_ENV"

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Upload only repaired files over verified FTPS
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER_CLEAN','$FTP_PASS' 'ftp://$FTP_HOST_CLEAN';
            pwd;
            put -O . .htaccess;
            mkdir -p js;
            put -O js js/app.js;
            bye
          "

      - name: Confirm deployment scope
        run: echo "Uploaded only .htaccess and js/app.js from the FTP account's assigned website root using verified FTPS."
