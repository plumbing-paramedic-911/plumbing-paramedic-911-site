name: Deploy SEO Repair to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-namecheap-seo-repair
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload repaired files to Namecheap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Verify required FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -eu
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Missing FTP_SERVER_DIR"; exit 1; }

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload only repaired files
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set ftp:prefer-epsv no;
            set net:timeout 30;
            set net:max-retries 10;
            set net:reconnect-interval-base 3;
            set net:reconnect-interval-max 15;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST$FTP_DIR;
            pwd;
            put -O . .htaccess;
            mkdir -p js;
            put -O js js/app.js;
            bye
          "

      - name: Confirm deployment scope
        run: echo "Uploaded only .htaccess and js/app.js. No other website files were deleted or replaced."
