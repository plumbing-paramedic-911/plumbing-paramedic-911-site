name: SEO AEO Quality Gate

on:
  push:
    branches:
      - claude/seo-aeo-authority-20260813
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate technical SEO and crawlability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Build production output
        shell: bash
        run: |
          set +e
          output="$(python3 tools/release_build.py 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            message="$(printf '%s' "$output" | tail -c 6000 | sed 's/%/%25/g; s/$/%0A/' | tr -d '\n')"
            echo "::error title=SEO AEO production build failed::$message"
            exit "$code"
          fi

      - name: Check sitemap and static internal links
        run: python3 tools/check_internal_links.py

      - name: Check Python syntax
        run: python3 -m py_compile tools/build.py tools/release_build.py tools/check_internal_links.py
